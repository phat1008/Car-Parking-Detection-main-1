<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Parking Dashboard</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --text:#e7e9ee; --muted:#8a90a0;
            --empty:#22c55e; --occupied:#ef4444; --unknown:#eab308; --invalid:#6b7280; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 24px; border-bottom:1px solid #262a33; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    h1 { font-size:18px; margin:0; }
    main { padding:24px; display:grid; gap:20px; max-width:1200px; margin:0 auto; }
    .card { background:var(--card); border-radius:12px; padding:18px; }
    .card h2 { font-size:15px; margin:0 0 12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
    .stat { background:#20242d; border-radius:10px; padding:14px; }
    .stat .value { font-size:28px; font-weight:700; }
    .stat .label { color:var(--muted); font-size:13px; }
    .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; }
    .slot { border-radius:8px; padding:10px 4px; text-align:center; font-size:13px; font-weight:600; color:#0b0d10; }
    .slot.empty { background:var(--empty); }
    .slot.occupied { background:var(--occupied); color:#fff; }
    .slot.unknown { background:var(--unknown); }
    .slot.invalid { background:var(--invalid); color:#fff; }
    .legend { color:var(--muted); font-size:13px; margin-top:10px; }
    form { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    button { background:#3b82f6; color:#fff; border:0; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    input[type=file] { color:var(--muted); }
    .msg { font-size:14px; min-height:20px; }
    .msg.error { color:#f87171; }
    .msg.ok { color:#4ade80; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid #262a33; }
    th { color:var(--muted); font-weight:600; }
    .badge { font-size:12px; padding:2px 8px; border-radius:999px; background:#262a33; color:var(--muted); }
  </style>
</head>
<body>
<header>
  <h1>Car Parking Dashboard</h1>
  <span class="badge" id="storage-badge">camera: {{ camera_id }}</span>
</header>

<main>
  <section class="card">
    <h2>Trạng thái hiện tại</h2>
    <div class="stats">
      <div class="stat"><div class="value" id="empty-count">–</div><div class="label">Ô trống</div></div>
      <div class="stat"><div class="value" id="occupied-count">–</div><div class="label">Ô có xe</div></div>
      <div class="stat"><div class="value" id="unknown-count">–</div><div class="label">Không chắc chắn</div></div>
      <div class="stat"><div class="value" id="configured-count">–</div><div class="label">Tổng ô đã cấu hình</div></div>
    </div>
    <p class="legend" id="updated-at">Chưa có dữ liệu.</p>
    <div class="slots" id="slot-grid"></div>
    <p class="legend">
      <span style="color:var(--empty)">■</span> trống &nbsp;
      <span style="color:var(--occupied)">■</span> có xe &nbsp;
      <span style="color:var(--unknown)">■</span> không chắc chắn &nbsp;
      <span style="color:var(--invalid)">■</span> lỗi
    </p>
  </section>

  <section class="card">
    <h2>Nhận diện từ ảnh</h2>
    <form id="upload-form">
      <input type="file" name="image" id="image-input" accept="image/jpeg,image/png" required>
      <button type="submit" id="submit-btn">Nhận diện</button>
    </form>
    <p class="msg" id="upload-msg"></p>
  </section>

  <section class="card">
    <h2>Lịch sử gần đây</h2>
    <table>
      <thead><tr><th>Thời gian (UTC)</th><th>Trống</th><th>Có xe</th><th>Không chắc chắn</th></tr></thead>
      <tbody id="history-body"><tr><td colspan="4">Đang tải...</td></tr></tbody>
    </table>
  </section>
</main>

<script>
const STATE_LABELS = { empty: "Trống", occupied: "Có xe", unknown: "?", invalid: "Lỗi" };

function setText(id, value) { document.getElementById(id).textContent = value; }

function renderCounts(counts, createdAt) {
  setText("empty-count", counts.empty);
  setText("occupied-count", counts.occupied);
  setText("unknown-count", counts.unknown);
  setText("configured-count", counts.configured);
  setText("updated-at", createdAt ? "Cập nhật lúc: " + new Date(createdAt).toLocaleString() : "Chưa có dữ liệu.");
}

function renderSlots(slots) {
  const grid = document.getElementById("slot-grid");
  grid.replaceChildren();
  for (const slot of slots) {
    const el = document.createElement("div");
    el.className = "slot " + slot.state;
    el.title = `Ô ${slot.id}: ${STATE_LABELS[slot.state] || slot.state} (độ tin cậy ${(slot.confidence * 100).toFixed(1)}%)`;
    el.textContent = slot.id;
    grid.appendChild(el);
  }
}

function applyRecord(record) {
  renderCounts(record.counts, record.created_at);
  renderSlots(record.slots);
}

async function loadStatus() {
  try {
    const res = await fetch("/api/status");
    const data = await res.json();
    if (data.latest) applyRecord(data.latest);
  } catch (err) {
    setText("updated-at", "Không tải được trạng thái.");
  }
}

async function loadHistory() {
  const body = document.getElementById("history-body");
  try {
    const res = await fetch("/api/history?limit=20");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Lỗi");
    body.replaceChildren();
    if (data.items.length === 0) {
      const tr = document.createElement("tr");
      tr.innerHTML = '<td colspan="4">Chưa có lịch sử.</td>';
      body.appendChild(tr);
      return;
    }
    for (const item of data.items) {
      const tr = document.createElement("tr");
      [item.created_at, item.counts.empty, item.counts.occupied, item.counts.unknown].forEach((v) => {
        const td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
      });
      body.appendChild(tr);
    }
  } catch (err) {
    body.replaceChildren();
    const tr = document.createElement("tr");
    tr.innerHTML = '<td colspan="4"></td>';
    tr.firstChild.textContent = "Không tải được lịch sử: " + err.message;
    body.appendChild(tr);
  }
}

document.getElementById("upload-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = document.getElementById("image-input");
  const btn = document.getElementById("submit-btn");
  const msg = document.getElementById("upload-msg");
  if (!input.files.length) return;

  const form = new FormData();
  form.append("image", input.files[0]);
  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "Đang nhận diện...";
  try {
    const res = await fetch("/api/detect", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Lỗi không xác định");
    applyRecord(data);
    msg.className = "msg ok";
    msg.textContent = data.saved ? "Đã nhận diện và lưu kết quả." : "Đã nhận diện nhưng KHÔNG lưu được vào cơ sở dữ liệu.";
    loadHistory();
  } catch (err) {
    msg.className = "msg error";
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

loadStatus();
loadHistory();
setInterval(loadStatus, 5000);
setInterval(loadHistory, 30000);
</script>
</body>
</html>
